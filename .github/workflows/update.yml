name: Mise a jour des cours
on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance lxml
      - run: python fetch.py
      - run: python fetch_stocks.py
        continue-on-error: true
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prices.json data/stocks.json
          git diff --staged --quiet || git commit -m "cours du jour"
          git push
